<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardCraftMini | Alex Morgan</title>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <article class="business-card">
      <img
        class="profile-photo"
        src="https://placehold.co/150x150/F4F1EA/293241?text=Alex"
        alt="Alex Morgan profile photo"
        width="120"
        height="120">

      <p class="eyebrow">HELLO, I'M</p>
      <h1>Alex Morgan</h1>
      <p class="job-title">Creative Designer &amp; Illustrator</p>

      <p class="bio">
        I turn creative ideas into thoughtful visuals and memorable
        digital experiences. Let's make something meaningful together.
      </p>

      <a class="contact-button" href="mailto:hello@example.com">
        Contact Me ↗
      </a>

      <nav class="social-links" aria-label="Social links">
        <a href="mailto:hello@example.com" aria-label="Email">✉</a>
        <a href="https://www.linkedin.com/"
           aria-label="LinkedIn">in</a>
        <a href="https://www.instagram.com/"
           aria-label="Instagram">◎</a>
      </nav>
    </article>
  </main>
</body>
</html>
